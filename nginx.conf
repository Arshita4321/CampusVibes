# CampusVibe Nginx Production Configuration
# Designed for React Router SPA Deployment on Ubuntu AWS EC2

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your EC2 Public IP or Domain (e.g. campusvibe.yourdomain.com)

    # Document Root pointing to Vite's production dist output
    root /var/www/campusvibe/dist;
    index index.html index.htm;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching (Vite hashes assets in /assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # SPA Routing: Fall back to index.html for all React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 'CampusVibe is healthy\n';
        add_header Content-Type text/plain;
    }

    # Custom 404 handler directed to SPA
    error_page 404 /index.html;

    # Error logging
    error_log /var/log/nginx/campusvibe_error.log warn;
    access_log /var/log/nginx/campusvibe_access.log;
}

